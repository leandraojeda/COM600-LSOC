# telegraf.conf
# ─────────────────────────────────────────────────────────────────
# Recolecta métricas desde el microservicio y las envía a InfluxDB.
# ─────────────────────────────────────────────────────────────────

[agent]
  interval = "5s"           # recolectar cada 5 segundos
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "5s"
  hostname = "telegraf"

# ── INPUT: recibe métricas del microservicio por HTTP ─────────────
[[inputs.http_listener_v2]]
  service_address = ":8094"
  path = "/metrics"
  methods = ["POST"]
  data_format = "influx"    # espera InfluxDB line protocol

# ── INPUT: métricas del propio sistema (CPU, memoria) ────────────
[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]

# ── OUTPUT: enviar todo a InfluxDB ────────────────────────────────
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "telegraf"
  skip_database_creation = false

# ── OUTPUT: imprimir en consola (útil para depuración) ───────────
[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"
