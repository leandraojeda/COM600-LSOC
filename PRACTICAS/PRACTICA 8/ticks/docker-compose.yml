version: '3.8'

services:

  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=telegraf              # base de datos por defecto
      - INFLUXDB_HTTP_AUTH_ENABLED=false  # sin auth para laboratorio
    volumes:
      - influxdata:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  telegraf:
    image: telegraf:1.29
    container_name: telegraf
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      influxdb:
        condition: service_healthy
    # Telegraf no expone puerto al host; se conecta internamente a InfluxDB

  chronograf:
    image: chronograf:1.10
    container_name: chronograf
    ports:
      - "8888:8888"
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - KAPACITOR_URL=http://kapacitor:9092
    depends_on:
      influxdb:
        condition: service_healthy

  kapacitor:
    image: kapacitor:1.7
    container_name: kapacitor
    ports:
      - "9092:9092"
    environment:
      - KAPACITOR_INFLUXDB_0_URLS_0=http://influxdb:8086
    volumes:
      - ./kapacitor.tick:/etc/kapacitor/kapacitor.tick:ro
    depends_on:
      influxdb:
        condition: service_healthy

  microservicio:
    build: ./microservicio
    container_name: microservicio-ticks
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - TELEGRAF_HOST=telegraf
      - TELEGRAF_PORT=8094   # puerto HTTP listener de Telegraf
    depends_on:
      - telegraf

volumes:
  influxdata:
