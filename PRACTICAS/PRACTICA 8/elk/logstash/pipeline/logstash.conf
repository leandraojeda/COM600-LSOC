# logstash/pipeline/logstash.conf
# ─────────────────────────────────────────────────────────────────
# Pipeline: recibe logs JSON por UDP desde el microservicio,
# los parsea y los envía a Elasticsearch.
# ─────────────────────────────────────────────────────────────────

input {
  udp {
    port => 5000
    codec => json          # el microservicio envía JSON directamente
  }
}

filter {
  # Si el mensaje trae un campo "timestamp" en ISO8601, lo usamos como @timestamp
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # Agregar campo de entorno para identificar la fuente
  mutate {
    add_field => { "environment" => "laboratorio" }
  }
}

output {
  # Enviar a Elasticsearch — un índice por día
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microservicio-%{+YYYY.MM.dd}"
  }

  # También imprimir en consola de Logstash (útil para depuración)
  stdout {
    codec => rubydebug
  }
}
